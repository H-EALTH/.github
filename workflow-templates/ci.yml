# H-EALTH CI — instradatore: capisce quali servizi sono cambiati e per ciascuno
# chiama i reusable workflows di H-EALTH/platform.
#
# Da adattare dopo la creazione del repo:
#   1. filtri in `changes`: un filtro per servizio Python (chiave = nome cartella in services/)
#   2. job `web`: path dell'app, oppure rimuovi il job se non c'è frontend
#   3. tag di H-EALTH/platform: pinna SEMPRE il tag completo (vX.Y.Z), mai @v1 né @main
name: ci
on:
  pull_request:
  push:
    branches: [$default-branch]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py: ${{ steps.f.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # <servizio>: ['services/<servizio>/**', 'libs/py/**']
            example-api: ['services/example-api/**', 'libs/py/**']

  python:
    needs: changes
    if: needs.changes.outputs.py != '[]'
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.py) }}
    uses: H-EALTH/platform/.github/workflows/ci-python.yml@v1.0.0
    with:
      service: ${{ matrix.service }}
      path: services/${{ matrix.service }}

  web:
    uses: H-EALTH/platform/.github/workflows/ci-node.yml@v1.0.0
    with:
      path: apps/example-web
